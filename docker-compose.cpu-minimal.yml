services:
  api:
    build: .
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      PROCTORSTREAM_DB_URL: sqlite:////app/data/proctorstream.db
      PROCTORSTREAM_STORAGE_DIR: /app/data/media
      PROCTORSTREAM_REPORT_DIR: /app/data/reports
      PROCTORSTREAM_TELEMETRY_SECRET: docker-dev-secret
    volumes: ["./data:/app/data"]
