[project]
name = "proctorstream"
version = "0.1.0"
description = "CPU-first end-to-end AI proctoring inference platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3", "python-multipart>=0.0.9,<1", "pyyaml>=6,<7",
  "prometheus-client>=0.20,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2", "redis>=5", "boto3>=1.35"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
models = ["opencv-python-headless>=4.10,<5", "onnxruntime>=1.18", "webrtcvad-wheels>=2.0.14"]
infra = ["psycopg[binary]>=3.2", "redis>=5", "boto3>=1.35"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["services", "services.api", "services.models", "services.workers", "services.realtime", "services.storage"]
