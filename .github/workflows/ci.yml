name: proctorstream-ci
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: proctor
          POSTGRES_PASSWORD: proctor
          POSTGRES_DB: proctorstream
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proctor -d proctorstream"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ['9000:9000', '9001:9001']
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 10
        command: server /data --console-address ":9001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test,models]'
      - name: Run unit and service integration tests
        env:
          PROCTORSTREAM_DB_URL: sqlite:///./data/ci.db
          PROCTORSTREAM_TEST_POSTGRES_URL: postgresql+psycopg://proctor:proctor@127.0.0.1:5432/proctorstream
          PROCTORSTREAM_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          PROCTORSTREAM_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          PROCTORSTREAM_EVIDENCE_DIR: ${{ github.workspace }}/artifacts
        run: pytest -q
      - name: Verify live service connectivity
        env:
          PGPASSWORD: proctor
        run: |
          mkdir -p artifacts
          pg_isready -h 127.0.0.1 -U proctor -d proctorstream | tee artifacts/postgres-health.txt
          redis-cli -h 127.0.0.1 ping | tee artifacts/redis-health.txt
          curl -fsS http://127.0.0.1:9000/minio/health/live | tee artifacts/minio-health.txt
      - name: Apply PostgreSQL migrations
        env:
          PGPASSWORD: proctor
        run: for migration in migrations/*.sql; do psql -h 127.0.0.1 -U proctor -d proctorstream -f "$migration"; done
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd frontend && npm ci && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - run: python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
      - name: Compose config validation
        run: docker compose config
      - name: CPU face inference smoke benchmark
        run: python benchmarks/run_face_benchmarks.py
      - name: CPU audio activity smoke benchmark
        run: python benchmarks/run_audio_benchmarks.py
      - name: Upload live pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proctorstream-live-pipeline-evidence
          path: artifacts/
          if-no-files-found: warn
